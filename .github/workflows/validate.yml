name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: |
          brew untap aws/tap || true
          brew install gitleaks just shellcheck trufflehog
      - name: Validate bootstrap
        run: just validate
